[project]
name = "prelegal-backend"
version = "0.1.0"
description = "The prelegal web app: a JSON API, the static frontend and a temporary SQLite database."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.0",
    "openai>=3.31.0",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]

[tool.uv]
# An application, not a library: there is nothing to build or install.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Smoke tests need a running container, and live tests call OpenAI, so they only run when asked for with `-m smoke`
# or `-m live`.
addopts = "-m 'not smoke and not live'"
markers = [
    "smoke: checks the running Docker container (start it with scripts/start-*)",
    "live: calls the real OpenAI API (needs OPENAI_API_KEY in .env)",
]
