# The whole app runs in one container. Start and stop it with the scripts in scripts/.
name: prelegal

services:
  app:
    build: .
    image: prelegal
    container_name: prelegal
    ports:
      # Only reachable from this computer: the prototype sign-in is not real authentication.
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
